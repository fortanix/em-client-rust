[package]
name = "em-node-agent-client"
version = "2.0.0"
edition = "2018"
authors = ["Fortanix Inc."]
license = "MPL-2.0"
description = "This crate provides rust bindings for Node Agent API."
repository = "https://github.com/fortanix/em-client-rust"

[dependencies]
async-trait = "0.1.83"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lazy_static = "1.0"
log = "0.4.28"
mime = "0.3.17"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
uuid = {version = "0.6", features = ["serde", "v4"]}
hyper = {version = "1.10", default-features = false}
url = {version = "1.5"}
simple-hyper-client = {version = "0.4.0"}
headers = {version = "0.4"}

