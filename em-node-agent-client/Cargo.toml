[package]
name = "em-node-agent-client"
version = "2.0.0"
edition = "2018"
authors = ["Fortanix Inc."]
license = "MPL-2.0"
description = "This crate provides rust bindings for Node Agent API."
repository = "https://github.com/fortanix/em-client-rust"

[features]
default = ["client"]
client = ["serde_ignored", "hyper", "url", "simple-hyper-client", "headers"]

[dependencies]
async-trait = "0.1.83"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lazy_static = "1.0"
log = "0.4.28"
mime = "0.3.17"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
uuid = {version = "0.6", features = ["serde", "v4"]}
hyper = {version = "1.10", default-features = false, optional = true}
serde_ignored = {version = "0.1.12", optional = true}
url = {version = "1.5", optional = true}
simple-hyper-client = {version = "0.4.0", optional = true}
headers = {version = "0.4", optional = true}

[dev-dependencies]
clap = "2.25"
error-chain = "0.12"
hyper = {version = "1.10", default-features = false, features = ["server", "http1"]}
hyper-util = {version = "0.1", features = ["tokio"]}
http-body-util = "0.1"
tokio = {version = "1", features = ["rt", "net", "time"]}
